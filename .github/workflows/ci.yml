name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    env:
      NODE_ENV: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate protobuf code
      run: npm run generate

    - name: Generate Prisma client (CI mode)
      run: |
        # Use CI setup script to create minimal types without downloading binaries
        node scripts/ci-setup.js

    - name: Build project
      run: npm run build

    - name: Run unit tests
      run: npm test